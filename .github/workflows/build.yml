name: Build

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main      
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Add hosts to /etc/hosts
        run: |
          sudo echo "127.0.0.1 kafkabroker" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 schemaregistry" | sudo tee -a /etc/hosts
      - name: Create docker-compose compatibility shim
        run: |
          echo '#!/bin/bash' | sudo tee /usr/local/bin/docker-compose
          echo 'exec docker compose "$@"' | sudo tee -a /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Pre-pull Docker images for integration tests
        run: |
          docker pull confluentinc/cp-zookeeper:7.2.2 &
          docker pull confluentinc/cp-kafka:7.2.2 &
          docker pull confluentinc/cp-schema-registry:7.2.2 &
          docker pull confluentinc/cp-kafka-connect:7.2.2 &
          docker pull postgres:16 &
          wait
      - name: Build Kafka Connect image with JDBC connector pre-installed
        run: docker build -t cp-kafka-connect-jdbc:test -f src/test/resources/docker/Dockerfile.connect src/test/resources/docker/
      - name: Build and verify
        run: mvn -B verify
